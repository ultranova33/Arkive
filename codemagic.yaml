workflows:
  ios-build:
    name: iOS Unsigned IPA Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter dependencies
        script: |
          flutter pub get
      - name: Build Unsigned iOS Release IPA
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Arkive.ipa Payload
          cp Arkive.ipa "$CM_BUILD_DIR/Arkive.ipa"
    artifacts:
      - Arkive.ipa